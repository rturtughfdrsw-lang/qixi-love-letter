<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6e7e5">
  <meta name="description" content="给郭静恬宝宝的一封七夕动态情书">
  <title>给郭静恬宝宝的一封信</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-atmosphere" aria-hidden="true">
    <span class="page-atmosphere__glow page-atmosphere__glow--one"></span>
    <span class="page-atmosphere__glow page-atmosphere__glow--two"></span>
    <span class="page-atmosphere__grain"></span>
  </div>

  <button
    id="music-toggle"
    class="music-toggle"
    type="button"
    aria-label="播放音乐"
    aria-pressed="false"
    hidden
  >
    <span class="music-toggle__icon" aria-hidden="true">♪</span>
  </button>

  <main id="app-stage" class="app-stage" aria-live="polite" aria-busy="true">
    <div class="loading-letter" role="status">
      <span class="loading-letter__heart" aria-hidden="true">♡</span>
      <span>正在送达这封信...</span>
    </div>
  </main>

  <section
    id="gallery-overlay"
    class="gallery-overlay"
    aria-modal="true"
    aria-label="照片相册"
    role="dialog"
    hidden
  ></section>

  <section id="error-panel" class="error-panel" role="alert" hidden></section>

  <noscript>
    <p class="noscript-message">这封动态情书需要开启 JavaScript 才能播放。</p>
  </noscript>

  <script type="module" src="js/main.js"></script>
</body>
</html>
